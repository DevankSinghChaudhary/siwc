[project]
site_name = "SIWC"
site_description = "Sign-in With ChatGPT documentation"
site_author = "Devank Singh Chaudhary"
repo_url = "https://github.com/devanksinghchaudhary/siwc"

docs_dir = "docs"
site_dir = "site"

copyright = '&copy; 2026 Evident. Released under the <a href="https://github.com/DevankSinghChaudhary/siwc?tab=MIT-1-ov-file">MIT License</a>.'

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "start/index.md" }
]

extra_css = ["stylesheets/extra.css"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/devanksinghchaudhary/evident"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:devanksinghchaudhary@gmail.com"
name = "Email"

[project.theme]
features = [
  "navigation.path",
  "content.code.copy",
  "navigation.tabs",
  "navigation.top",
  "navigation.tabs.sticky",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
